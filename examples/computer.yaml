name: example

memory: 512

cpu:
  tier: 2

gpu:
  tier: 3
  screen:
    width: 80
    height: 25
    maxDepth: 8

eeprom:
  bios: builtin
  boot: auto

filesystems:
  - label: openos
    path: builtin
    mount: /
    readonly: false

components:
  keyboard: true
  mouse: true

internet:
  # Canonical flags are enableHttp/enableTcp; `enabled`/`tcp` are aliases.
  enabled: true
  # HTTP request timeout in seconds; 0 = no timeout.
  timeout: 30
  # TCP connections via component.internet.connect (default true).
  tcp: true
  # Default OC rules deny loopback/private; add an allow rule for local tests.
  filteringRules:
    - removeme
    - deny private
    - deny bogon
    - allow default
  maxTcpConnections: 4
  maxReadBuffer: 2048
  userAgent: opencomputers/ocplay

run:
  timeout: 0
  interactive: false
  # Seconds to keep the final screen visible after the machine stops.
  terminateDelay: 5
